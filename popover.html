<!doctype html>
<html><head><meta charset="utf-8"><title>Jumpscare</title>
<style>
  body{font-family:system-ui,sans-serif;margin:12px;color:#ddd;font-size:14px;color-scheme:dark}
  button{cursor:pointer;margin:6px 6px 0 0;padding:6px 10px}
  pre{white-space:pre-wrap;font-size:12px;background:#0003;padding:8px;border-radius:4px;max-height:260px;overflow:auto}
  small{opacity:.7;display:block;margin-top:8px}
</style></head>
<body>
  <div id="gm" style="display:none">
    <button id="open">⚙ Open settings</button>
    <button id="test">▶ Test default scare</button>
  </div>
  <button id="diag">🔍 Diagnose</button>
  <pre id="out" style="display:none"></pre>
  <small id="hint"></small>
<script type="module">
  import { OBR, SETTINGS_MODAL, DEFAULT_CFG, base, showScare, analyze, roomSettings } from "./shared.js";
  OBR.onReady(async () => {
    const role = await OBR.player.getRole();
    if (role === "GM") {
      document.getElementById("gm").style.display = "block";
      document.getElementById("hint").textContent = "Right-click a token → Token Settings for range and shape.";
      document.getElementById("open").onclick = () =>
        OBR.modal.open({ id: SETTINGS_MODAL, url: base("settings.html"), width: 700, height: 740 });
      document.getElementById("test").onclick = () => showScare({ ...DEFAULT_CFG });
    } else {
      document.getElementById("hint").textContent = "Right-click your token → Token Settings to set its range and shape.";
    }

    document.getElementById("diag").onclick = async () => {
      const out = document.getElementById("out");
      out.style.display = "block";
      try {
        const room = roomSettings(await OBR.room.getMetadata());
        const items = await OBR.scene.items.getItems();
        const a = await analyze(items, OBR.player.id);
        const L = [];
        L.push(`Your role: ${role}` + (role === "GM" ? "  ← the GM never gets scared. Run this as a PLAYER." : ""));
        L.push(`Mode: ${room.mode}`);
        L.push(`Enabled for you: ${room.disabled[OBR.player.id] ? "NO (GM turned you off)" : "yes"}`);
        L.push(`Your creatures: ${a.mine.length}` + (a.mine.length ? ` (${a.mine.map((m) => `${m.item.name || "token"} range ${m.cfg.range}`).join(", ")})` : ""));
        if (!a.mine.length) L.push("  ⚠ No creature is assigned to you. GM: set the owner in the settings token list.");
        L.push(`Jumpscare creatures: ${a.scary.length}`);
        if (a.otherLayer) L.push(`  ⚠ ${a.otherLayer} configured token(s) aren't on the Character layer and are ignored.`);
        for (const r of a.results) {
          L.push(`• ${r.s.item.name || "token"}: range ${r.s.cfg.range} (${r.s.cfg.shape})` +
            (r.nearest == null ? "" : `, nearest of your creatures ${r.nearest.toFixed(1)} cells away`));
          L.push(`    you entered its range: ${r.entered ? "YES" : "no"} | it's in your sight: ${r.seen ? "YES" : "no"}`);
          if (r.s.cfg.range <= 0) L.push("    ⚠ its range is 0, so entering never triggers.");
        }
        out.textContent = L.join("\n");
      } catch (e) { out.textContent = "Error: " + e.message; }
    };
  });
</script></body></html>
