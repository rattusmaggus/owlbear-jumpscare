<!doctype html>
<html><head><meta charset="utf-8"><title>Enable sound</title>
<style>
  body{font-family:system-ui,sans-serif;margin:14px;color:#ddd;text-align:center;font-size:14px}
  button{cursor:pointer;margin-top:12px;padding:10px 16px;font-size:15px}
</style></head>
<body>
  <div>This room uses <b>Jumpscare</b>.<br>Browsers need one click before they allow sound.</div>
  <button id="b">🔊 Enable sound</button>
<script type="module">
  import { OBR, ENABLE_MODAL } from "./shared.js";
  OBR.onReady(() => {
    document.getElementById("b").onclick = async () => {
      try { await new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=").play(); } catch {}
      try { await new AudioContext().resume(); } catch {}
      OBR.modal.close(ENABLE_MODAL);
    };
  });
</script></body></html>
